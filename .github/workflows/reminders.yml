# Calls the reminder endpoint every 15 minutes. Vercel's free (Hobby) plan only
# allows daily cron jobs, so this schedule lives here instead. Set two
# repository secrets: APP_URL (e.g. https://your-journal.vercel.app) and CRON_SECRET.
name: Reminders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.REMINDERS_ENABLED != 'false' }}
    steps:
      - name: Send due reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET not set, skipping."
            exit 0
          fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/reminders"
