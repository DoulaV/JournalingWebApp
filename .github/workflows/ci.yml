name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: pnpm exec supabase start -x vector,imgproxy,supavisor,postgres-meta,studio,edge-runtime,logflare,realtime
      - name: Write .env.local from local Supabase
        run: |
          pnpm exec supabase status -o env > /tmp/sb.env
          source /tmp/sb.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "MAILPIT_URL=$MAILPIT_URL"
            echo "ALLOWED_EMAIL=ahmed@example.com"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "CRON_SECRET=ci-cron-secret"
            echo "VAPID_SUBJECT=mailto:ci@example.com"
          } > .env.local
          node scripts/gen-secrets.mjs | grep VAPID >> .env.local
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          E2E_BUILD: "1"
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
